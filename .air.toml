root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
bin = "./tmp/main"
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", ".git"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

# Mac Docker Desktop-এ file change detect reliably করার জন্য
poll = true
poll_interval = 500

[log]
time = true

[misc]
clean_on_exit = true
